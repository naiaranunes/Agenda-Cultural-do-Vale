{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Evento</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/editar_evento.css' %}">
</head>
<body>

    <div class="evento-container">

        <div class="evento-card">

            <h1>Agenda Cultural do Vale</h1>

            <h3>Editar Evento</h3>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Título</label>

                    <input
                        type="text"
                        name="titulo"
                        class="form-control"
                        value="{{ evento.titulo }}"
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Descrição</label>

                    <textarea
                        name="descricao"
                        class="form-control"
                        rows="4"
                    >{{ evento.descricao }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Local</label>

                    <input
                        type="text"
                        name="local"
                        class="form-control"
                        value="{{ evento.local }}"
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Data</label>

                    <input
                        type="date"
                        name="data"
                        class="form-control"
                        value="{{ evento.data|date:'Y-m-d' }}"
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoria</label>

                    <select name="categoria" class="form-select">

                        <option value="SHOW" {% if evento.categoria == 'SHOW' %}selected{% endif %}>Show</option>

                        <option value="FEIRA" {% if evento.categoria == 'FEIRA' %}selected{% endif %}>Feira</option>

                        <option value="TEATRO" {% if evento.categoria == 'TEATRO' %}selected{% endif %}>Teatro</option>

                        <option value="EXPOSICAO" {% if evento.categoria == 'EXPOSICAO' %}selected{% endif %}>Exposição</option>

                        <option value="RELIGIOSO" {% if evento.categoria == 'RELIGIOSO' %}selected{% endif %}>Religioso</option>

                        <option value="OUTRO" {% if evento.categoria == 'OUTRO' %}selected{% endif %}>Outro</option>

                    </select>

                </div>

                {% if evento.imagem %}
                    <div class="text-center mb-3">

                        <p><strong>Imagem Atual</strong></p>

                        <img
                            src="{{ evento.imagem.url }}"
                            class="imagem-atual"
                            alt="{{ evento.titulo }}"
                        >

                    </div>
                {% endif %}

                <div class="mb-3">
                    <label class="form-label">Nova Imagem</label>

                    <input
                        type="file"
                        name="imagem"
                        class="form-control"
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-atualizar"
                >
                    Atualizar Evento
                </button>

            </form>

            <div class="botoes">

                <a href="{% url 'meus_eventos' %}"
                   class="btn btn-voltar">
                    Voltar
                </a>

                <a href="{% url 'home' %}"
                   class="btn btn-home">
                    Home
                </a>

            </div>

        </div>

    </div>

</body>
</html>
